name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci installs the exact dependency tree from the committed lockfile.
      - name: Install dependencies
        run: npm ci

      # Copies cockpit's pkg/lib and builds dist/, as a developer would with
      # "npm run init".
      - name: Prepare cockpit libraries and build
        run: node build_init.cjs

      - name: Run the unit tests with coverage
        run: npm run coverage
