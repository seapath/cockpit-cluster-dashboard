name: Build and publish Cockpit cluster dashboard plugin

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - run: npm run init

      - name: Pack dist folder
        run: tar -czvf cockpit-cluster-dashboard.tar.gz -C dist/ .

      - name: Upload artifact
        uses: softprops/action-gh-release@v3
        with:
          files: ./cockpit-cluster-dashboard.tar.gz
